services:
  nginx:
    image: nginx:alpine
    pull_policy: always
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - private
      - public
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/servers.conf:/etc/nginx/conf.d/servers.conf:ro
      - ./services/blog:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/dns-cloudflare
    # untagged, so :latest. This one talks to the ACME and Cloudflare APIs on a
    # cron — a copy cached months ago fails renewal long after anyone is looking.
    pull_policy: always
    profiles: ["certbot"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/cloudflare.ini:/cloudflare.ini:ro

  postgis:
    image: kartoza/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - private

  geohub:
    image: ghcr.io/rikferreira/geohub:sha-e3db5b0d5b53353035f5e1edfe93836db6d3894b
    # :latest is mutable, so a cached copy pins the host to whatever it pulled
    # first. --force-recreate recreates the container, not the image.
    pull_policy: always
    restart: always
    environment:
      ARCGIS_USERNAME: ${ARCGIS_USERNAME}
      ARCGIS_PASSWORD: ${ARCGIS_PASSWORD}
    networks:
      - private

volumes:
  pgdata:
    driver: local
  
networks:
  public:
    driver: bridge
  private:
    driver: bridge
