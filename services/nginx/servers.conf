# HTTP: everything redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rikalves.com www.rikalves.com geohub.rikalves.com;
    return 301 https://$host$request_uri;
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rikalves.com;

    ssl_certificate     /etc/letsencrypt/live/rikalves.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rikalves.com/privkey.pem;

    return 301 https://rikalves.com$request_uri;
}

# apex: static Hello world
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rikalves.com;

    ssl_certificate     /etc/letsencrypt/live/rikalves.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rikalves.com/privkey.pem;

    root  /usr/share/nginx/html;
    index index.html;
}

# geohub: placeholder until the backend is decided
# ponytail: swap this location for `proxy_pass http://geohub:PORT;` when the app exists
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name geohub.rikalves.com;

    ssl_certificate     /etc/letsencrypt/live/rikalves.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rikalves.com/privkey.pem;

    location / {
        default_type text/plain;
        return 200 "Serviços dedicados ao GeoHub da TPF Engenharia. Consulte a documentação da API para obter mais informações.\n";
    }
}
