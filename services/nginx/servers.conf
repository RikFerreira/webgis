# HTTP: everything redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rikalves.com www.rikalves.com wsnet.rikalves.com;
    return 301 https://$host$request_uri;
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rikalves.com;

    ssl_certificate     /etc/letsencrypt/live/rikalves.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rikalves.com/privkey.pem;

    return 301 https://rikalves.com$request_uri;
}

# apex: static Hello world
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rikalves.com;

    ssl_certificate     /etc/letsencrypt/live/rikalves.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rikalves.com/privkey.pem;

    root  /usr/share/nginx/html;
    index index.html;
}

# wsnet: Survey123 webhook backend
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wsnet.rikalves.com;

    ssl_certificate     /etc/letsencrypt/live/rikalves.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rikalves.com/privkey.pem;

    location / {
        proxy_pass http://wsnet:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # build_network runs the attachment download, workbook parse and
        # both publishes inside the request; a large network takes minutes
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
